name: Bug report
description: Something is wrong, missing or misleading
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. The most useful thing you can paste is the output of `kerna check`: it shows what kerna can and cannot see on your machine, and it contains no host name, user name or file names.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A wrong finding, a missing finding, a crash, a confusing message...
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `kerna check`
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The output that looks wrong (optional)
      description: For example `kerna`, `kerna why <program>` or `kerna --json`. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: kerna version (`kerna version`)
    validations:
      required: true
